<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>OpenClaw Mothership UI</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
body { font-family: -apple-system; margin:0; background:#0b1020; color:#e8ecf3;}
header{padding:20px;background:#121933;border-bottom:1px solid #243056;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;padding:16px;}
.card{background:#121933;border:1px solid #243056;border-radius:14px;padding:16px;}
.value{font-size:24px;font-weight:700;}

table{width:100%;border-collapse:collapse;}
th,td{padding:8px;font-size:12px;border-bottom:1px solid #243056;}

.status-new{color:#4ea1ff;}
.status-started{color:#ffcc00;}
.status-running{color:#ffcc00;}
.status-done{color:#3ddc84;}
.status-cancelled{color:#9aa4b2;}
.status-retry{color:#ff8a3d;}
.status-failed{color:#ff5d5d;}

.badge{padding:2px 6px;border-radius:6px;font-size:10px;background:#243056;}

.mono{font-family:monospace;white-space:pre-wrap;word-break:break-word;}

.row{display:grid;grid-template-columns:1fr;gap:16px;padding:16px;}

#detail{
position:fixed;
top:0;right:0;
width:400px;height:100%;
background:#121933;
border-left:1px solid #243056;
overflow:auto;
padding:16px;
display:none;
}

.status-chip{
display:inline-flex;
align-items:center;
gap:6px;
padding:4px 10px;
border-radius:999px;
font-size:12px;
font-weight:600;
color:#fff;
}

.status-success{background:#10B981;}
.status-info{background:#3B82F6;}
.status-warning{background:#F97316;}
.status-danger{background:#EF4444;}
.status-neutral{background:#6B7280;}

.bot-badge{
display:inline-flex;
align-items:center;
gap:4px;
padding:2px 6px;
border-radius:8px;
background:#0EA5E9;
color:#fff;
font-size:11px;
font-weight:700;
}

.mobile-card{
display:flex;
flex-direction:column;
gap:6px;
padding:10px;
}

.mobile-header{
display:flex;
justify-content:space-between;
align-items:center;
}

.mobile-text{
font-size:13px;
line-height:1.4;
word-break:break-word;
}


@media (max-width: 600px){
.grid{
grid-template-columns:repeat(2,1fr);
}

.card{
padding:12px;
}

.value{
font-size:18px;
}

table{
font-size:11px;
}

button{
width:100%;
padding:10px;
margin-top:6px;
}

input, select, textarea{
width:100%;
margin-bottom:8px;
}
}


.tasks_cards{
display:grid;
grid-template-columns:1fr;
gap:10px;
}

.task_card{
background:#121933;
border:1px solid #243056;
border-radius:14px;
padding:12px;
cursor:pointer;
}

.task_card:hover{
background:#172044;
}

.task_card_head{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
margin-bottom:8px;
}

.task_card_meta{
display:flex;
gap:8px;
flex-wrap:wrap;
align-items:center;
}

.task_id{
font-size:12px;
color:#9fb0d9;
}

.task_text{
font-size:13px;
line-height:1.45;
word-break:break-word;
white-space:pre-wrap;
margin-top:6px;
}

.task_actions{
margin-top:10px;
display:flex;
gap:8px;
}

@media (max-width: 600px){
.task_card{
padding:10px;
}
.task_text{
font-size:12px;
}
}


.toolbar{
display:grid;
grid-template-columns:160px 160px 1fr;
gap:8px;
margin-bottom:12px;
}

.toolbar input,
.toolbar select{
padding:10px;
background:#0b1020;
color:#e8ecf3;
border:1px solid #243056;
border-radius:10px;
}

.detail-actions{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:8px;
margin:12px 0;
}

.child-btn{
width:100%;
text-align:left;
padding:10px;
background:#0b1228;
color:#e8ecf3;
border:1px solid #243056;
border-radius:10px;
cursor:pointer;
}

.reply-collapsed{
max-height:180px;
overflow:auto;
}

@media (max-width: 600px){
.toolbar{
grid-template-columns:1fr;
}
.detail-actions{
grid-template-columns:1fr;
}
}


.queue_grid{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:12px;
}
.queue_col{
background:#0b1228;
border:1px solid #243056;
border-radius:12px;
padding:10px;
min-height:120px;
}
.queue_title{
font-size:12px;
color:#9fb0d9;
margin-bottom:8px;
text-transform:uppercase;
}
.queue_item{
padding:8px;
border:1px solid #243056;
border-radius:10px;
margin-bottom:8px;
background:#121933;
cursor:pointer;
font-size:12px;
line-height:1.4;
word-break:break-word;
}
.queue_item:last-child{
margin-bottom:0;
}
.reply-collapsed{
max-height:180px;
overflow:auto;
}
@media (max-width: 900px){
.queue_grid{
grid-template-columns:1fr;
}
}


.queue_list{
display:grid;
gap:8px;
}


#toast{
position:fixed;
left:50%;
bottom:18px;
transform:translateX(-50%);
background:#121933;
color:#e8ecf3;
border:1px solid #243056;
border-radius:12px;
padding:10px 14px;
z-index:1200;
display:none;
box-shadow:0 8px 24px rgba(0,0,0,.35);
font-size:12px;
}


.artifacts_grid{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:12px;
}
.artifact_card{
background:#121933;
border:1px solid #243056;
border-radius:12px;
padding:12px;
cursor:pointer;
}
.artifact_name{
font-size:12px;
font-weight:700;
word-break:break-word;
margin-bottom:6px;
}
.artifact_meta{
font-size:11px;
color:#9fb0d9;
margin-bottom:8px;
}
.artifact_body{
font-size:12px;
white-space:pre-wrap;
word-break:break-word;
max-height:160px;
overflow:auto;
background:#0b1020;
border:1px solid #243056;
border-radius:8px;
padding:8px;
}
@media (max-width: 900px){
  .artifacts_grid{ grid-template-columns:1fr; }
}

.dev-autopilot-shell{
display:grid;
gap:12px;
}

.dev-toolbar{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
flex-wrap:wrap;
}

.dev-actions{
display:flex;
align-items:center;
gap:8px;
flex-wrap:wrap;
}

.dev-button{
padding:9px 12px;
background:#1f6feb;
color:#fff;
border:1px solid #3b82f6;
border-radius:8px;
font-weight:700;
cursor:pointer;
}

.dev-safe-button{
padding:9px 12px;
background:#172044;
color:#e8ecf3;
border:1px solid #3ddc84;
border-radius:8px;
font-weight:700;
cursor:pointer;
}

.dev-toggle{
display:inline-flex;
align-items:center;
gap:6px;
font-size:12px;
color:#b8c4e8;
}

.dev-toggle input{
width:auto;
margin:0;
}

.dev-tabs{
display:flex;
gap:6px;
overflow:auto;
padding-bottom:2px;
}

.dev-tab{
flex:0 0 auto;
padding:8px 10px;
background:#0b1228;
color:#cdd6f4;
border:1px solid #243056;
border-radius:8px;
font-weight:700;
cursor:pointer;
}

.dev-tab.active{
background:#e8ecf3;
color:#0b1020;
border-color:#e8ecf3;
}

.dev-panel{display:none;}
.dev-panel.active{display:grid;gap:12px;}

.dev-card-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:10px;
}

.dev-metric{
background:#0b1228;
border:1px solid #243056;
border-radius:8px;
padding:12px;
min-width:0;
}

.dev-label{
font-size:11px;
color:#9fb0d9;
text-transform:uppercase;
letter-spacing:0;
margin-bottom:6px;
}

.dev-value{
font-size:15px;
line-height:1.35;
font-weight:700;
word-break:break-word;
}

.risk-chip{
display:inline-flex;
align-items:center;
padding:5px 9px;
border-radius:999px;
font-size:12px;
font-weight:800;
}

.risk-critical{background:#4b1116;color:#ffb4b4;border:1px solid #ef4444;}
.risk-warning{background:#3f2507;color:#ffd08a;border:1px solid #f97316;}
.risk-stable{background:#07351f;color:#9cf0bd;border:1px solid #22c55e;}

.dev-chip-stack{
display:flex;
flex-direction:column;
gap:7px;
}

.dev-chain-row{
display:flex;
align-items:center;
gap:7px;
flex-wrap:wrap;
}

.dev-chain-chip{
background:#162044;
border:1px solid #33406f;
border-radius:999px;
padding:6px 9px;
font-size:12px;
font-weight:700;
word-break:break-word;
max-width:100%;
}

.dev-chain-arrow{
color:#9fb0d9;
font-size:12px;
font-weight:800;
}

.dev-list{
display:grid;
gap:8px;
margin:0;
padding:0;
list-style:none;
}

.dev-list li{
background:#0b1228;
border:1px solid #243056;
border-radius:8px;
padding:9px;
font-size:13px;
line-height:1.4;
word-break:break-word;
}

.dev-note{
font-size:12px;
color:#b8c4e8;
line-height:1.45;
word-break:break-word;
}

.dev-error{
background:#3b1215;
border:1px solid #ef4444;
color:#ffd1d1;
border-radius:8px;
padding:10px;
font-size:13px;
}

.timeline{
display:grid;
gap:8px;
}

.timeline-item{
display:grid;
grid-template-columns:auto 1fr;
gap:9px;
align-items:start;
background:#0b1228;
border:1px solid #243056;
border-radius:8px;
padding:10px;
}

.timeline-dot{
width:10px;
height:10px;
border-radius:999px;
margin-top:5px;
background:#3b82f6;
}

.timeline-dot.incident{background:#ef4444;}
.timeline-dot.policy{background:#8b5cf6;}
.timeline-dot.instability{background:#f97316;}
.timeline-dot.remediation{background:#22c55e;}

.timeline-title{
font-size:13px;
font-weight:800;
line-height:1.3;
word-break:break-word;
}

.timeline-meta{
font-size:11px;
color:#9fb0d9;
margin-top:3px;
word-break:break-word;
}

.comparison-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
gap:10px;
}

.compare-card{
background:#0b1228;
border:1px solid #243056;
border-radius:8px;
padding:12px;
display:grid;
gap:9px;
}

.compare-card:first-child{
border-color:#3ddc84;
}

.compare-title{
font-size:14px;
font-weight:800;
line-height:1.35;
word-break:break-word;
}

.compare-mini-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
}

.compare-mini{
background:#121933;
border:1px solid #243056;
border-radius:8px;
padding:8px;
min-width:0;
}

.compare-mini b{
display:block;
font-size:15px;
line-height:1.2;
word-break:break-word;
}

.sparkline{
display:flex;
align-items:end;
gap:3px;
height:32px;
padding:4px 0;
}

.sparkbar{
flex:1;
min-width:4px;
border-radius:3px 3px 0 0;
background:#3b82f6;
}

.sparkbar.critical{background:#ef4444;}
.sparkbar.warning{background:#f97316;}
.sparkbar.stable{background:#22c55e;}

.approval-shell{
display:grid;
gap:12px;
}

.approval-summary{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:10px;
}

.approval-cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:12px;
}

.approval-card{
background:#0b1228;
border:1px solid #243056;
border-radius:8px;
padding:12px;
display:grid;
gap:10px;
min-width:0;
}

.approval-card.high,
.approval-card.critical{
border-color:#f97316;
}

.approval-head{
display:flex;
justify-content:space-between;
gap:10px;
align-items:flex-start;
}

.approval-title{
font-size:15px;
font-weight:800;
line-height:1.35;
word-break:break-word;
}

.approval-state{
flex:0 0 auto;
font-size:11px;
font-weight:800;
border:1px solid #33406f;
border-radius:999px;
padding:5px 8px;
background:#121933;
color:#cdd6f4;
}

.approval-banner{
background:#3f2507;
border:1px solid #f97316;
color:#ffd08a;
border-radius:8px;
padding:9px;
font-size:12px;
font-weight:800;
line-height:1.35;
}

.approval-fields{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:8px;
}

.approval-field{
background:#121933;
border:1px solid #243056;
border-radius:8px;
padding:8px;
min-width:0;
}

.approval-field b{
display:block;
font-size:13px;
line-height:1.3;
word-break:break-word;
}

.approval-reasoning{
display:grid;
gap:8px;
}

.alignment-bars{
display:grid;
gap:7px;
}

.alignment-row{
display:grid;
grid-template-columns:126px 1fr 34px;
gap:7px;
align-items:center;
font-size:12px;
}

.alignment-track{
height:8px;
background:#121933;
border:1px solid #243056;
border-radius:999px;
overflow:hidden;
}

.alignment-fill{
height:100%;
background:#3ddc84;
border-radius:999px;
}

@media (max-width: 600px){
.dev-toolbar{
align-items:stretch;
}
.dev-actions{
width:100%;
display:grid;
grid-template-columns:1fr;
}
.dev-button,
.dev-safe-button{
width:100%;
margin:0;
}
.dev-card-grid{
grid-template-columns:1fr;
}
.dev-tab{
padding:9px 10px;
}
.dev-chain-row{
align-items:flex-start;
flex-direction:column;
}
.dev-chain-arrow{
transform:rotate(90deg);
padding-left:8px;
}
.comparison-grid{
grid-template-columns:1fr;
}
.compare-mini-grid{
grid-template-columns:1fr 1fr;
}
.approval-cards,
.approval-summary,
.approval-fields{
grid-template-columns:1fr;
}
.approval-head{
flex-direction:column;
}
.approval-state{
align-self:flex-start;
}
}

</style>
</head>

<body>

<header>
<h2>OpenClaw Mothership UI</h2>
</header>

<div class="grid">
<div class="card"><div>Tasks</div><div id="router_tasks" class="value">-</div></div>
<div class="card"><div>Execs</div><div id="execs" class="value">-</div></div>
<div class="card"><div>Artifacts</div><div id="artifacts" class="value">-</div></div>
<div class="card"><div>Caps</div><div id="capabilities" class="value">-</div></div>
<div class="card"><div>New</div><div id="count_new" class="value">-</div></div>
<div class="card"><div>Started</div><div id="count_started" class="value">-</div></div>
<div class="card"><div>Failed</div><div id="count_failed" class="value">-</div></div>


<div class="row">

  <div class="card">
    <h3>Manual EXEC</h3>
    <div style="display:grid;gap:8px;">
      <select id="f_exec_script">
        <option value="status_core.sh">status_core.sh</option>
        <option value="db_health.sh">db_health.sh</option>
        <option value="log_check.sh">log_check.sh</option>
        <option value="route_smoke.sh">route_smoke.sh</option>
        <option value="deploy_safe.sh">deploy_safe.sh</option>
        <option value="run_python.sh">run_python.sh</option>
      </select>
      <input id="f_exec_args" placeholder="arg=... の中身だけ" />
      <button onclick="submitExec()">EXEC投入</button>
      <div id="exec_result" class="mono"></div>
    </div>
  </div>

  <div class="card">
    <h3>New Task</h3>
    <div style="display:grid;gap:8px;">
      <input id="f_target_bot" value="kaikun04" placeholder="target_bot" style="padding:8px;background:#0b1020;color:#e8ecf3;border:1px solid #243056;border-radius:8px;">
      <input id="f_mode" value="THINK" placeholder="mode" style="padding:8px;background:#0b1020;color:#e8ecf3;border:1px solid #243056;border-radius:8px;">
      <input id="f_task_role" value="" placeholder="task_role (optional)" style="padding:8px;background:#0b1020;color:#e8ecf3;border:1px solid #243056;border-radius:8px;">
      <input id="f_parent_task_id" value="" placeholder="parent_task_id (optional)" style="padding:8px;background:#0b1020;color:#e8ecf3;border:1px solid #243056;border-radius:8px;">
      <textarea id="f_task_text" placeholder="task_text" style="min-height:120px;padding:8px;background:#0b1020;color:#e8ecf3;border:1px solid #243056;border-radius:8px;"></textarea>
      <div style="display:flex;gap:8px;">
        <button onclick="submitTask()">タスク投入</button>
        <button onclick="document.getElementById('detail').style.display='none'">詳細閉じる</button>
      </div>
      <div id="submit_result" class="mono"></div>
    </div>
  </div>
</div>

<div class="row">
  <div class="card" style="grid-column:1/-1;">
    <div class="dev-autopilot-shell">
      <div class="dev-toolbar">
        <h3 style="margin:0;">Dev Autopilot</h3>
        <div class="dev-actions">
          <button class="dev-button" type="button" onclick="manualRefresh()">Refresh</button>
          <label class="dev-toggle">
            <input id="dev_autorefresh" type="checkbox" onchange="toggleAutoRefresh(this.checked)">
            Auto-refresh
          </label>
        </div>
      </div>

      <div class="dev-tabs" role="tablist" aria-label="Dev Autopilot sections">
        <button class="dev-tab active" type="button" data-dev-tab="executive" onclick="setDevTab('executive')">Executive</button>
        <button class="dev-tab" type="button" data-dev-tab="risks" onclick="setDevTab('risks')">Risks</button>
        <button class="dev-tab" type="button" data-dev-tab="policy" onclick="setDevTab('policy')">Policy</button>
        <button class="dev-tab" type="button" data-dev-tab="loop" onclick="setDevTab('loop')">Loop</button>
        <button class="dev-tab" type="button" data-dev-tab="memory" onclick="setDevTab('memory')">Memory</button>
      </div>

      <div id="dev_error"></div>
      <div id="dev_operator_message" class="dev-note"></div>

      <div id="dev_panel_executive" class="dev-panel active"></div>
      <div id="dev_panel_risks" class="dev-panel"></div>
      <div id="dev_panel_policy" class="dev-panel"></div>
      <div id="dev_panel_loop" class="dev-panel"></div>
      <div id="dev_panel_memory" class="dev-panel"></div>
    </div>
  </div>
</div>

<div class="row">
  <div class="card" style="grid-column:1/-1;">
    <div class="approval-shell">
      <div class="dev-toolbar">
        <h3 style="margin:0;">Approval Queue</h3>
        <div class="dev-note">Recommendation only. Execution disabled. Dry-run only after human review.</div>
      </div>
      <div id="approval_error"></div>
      <div id="approval_summary" class="approval-summary"></div>
      <div id="approval_cards" class="approval-cards"></div>
    </div>
  </div>
</div>

<div class="row">

<div>
<h3>Tasks</h3>

<div class="toolbar">
  <select id="filter_status" onchange="persistFilters(); loadAll()">
    <option value="">all status</option>
    <option value="new">new</option>
    <option value="started">started</option>
    <option value="running">running</option>
    <option value="done">done</option>
    <option value="retry">retry</option>
    <option value="failed">failed</option>
    <option value="cancelled">cancelled</option>
  </select>

  <select id="filter_bot" onchange="persistFilters(); loadAll()">
    <option value="">all bot</option>
    <option value="kaikun04">kaikun04</option>
    <option value="ops_exec">ops_exec</option>
  </select>

  <input id="filter_q" placeholder="search task text" oninput="persistFilters(); loadAll()" />
</div>

<div id="tasks_body" class="tasks_cards"></div>
</div>

<div>
<h3>Relations</h3>
<table>
<thead><tr><th>Parent → Child</th></tr></thead>
<tbody id="relations_body"></tbody>
</table>
</div>

</div>


<div class="row">
  <div class="card">
    <h3>Queue</h3>
    <div class="queue_grid">
      <div class="queue_col">
        <div class="queue_title">new</div>
        <div id="queue_new" class="queue_list"></div>
      </div>
      <div class="queue_col">
        <div class="queue_title">started</div>
        <div id="queue_started" class="queue_list"></div>
      </div>
      <div class="queue_col">
        <div class="queue_title">failed</div>
        <div id="queue_failed" class="queue_list"></div>
      </div>
    </div>
  </div>
</div>


<div class="row">
  <div class="card" style="grid-column:1/-1;">
    <h3>tmp_exec Artifacts</h3>
    <div id="tmp_exec_body" class="artifacts_grid"></div>
  </div>
</div>

<div id="detail_backdrop" onclick="closeDetail()"></div>
<div id="detail"></div>

<script>

const API = "";
let __autoRefreshTimer = null;
let __activeDevTab = "executive";

function esc(v){
  return String(v ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#39;");
}

function riskLevel(data){
  const instability = Number(data?.summary?.health?.instability_score ?? data?.loop?.instability_score ?? 0);
  const sustainability = Number(data?.summary?.sustainability_score ?? data?.plan?.sustainability_score ?? 100);
  const status = String(data?.summary?.status ?? data?.loop?.status ?? "").toLowerCase();
  if(status.includes("critical") || instability >= 80 || sustainability < 35) return "critical";
  if(status.includes("stabil") || instability >= 55 || sustainability < 60) return "warning";
  return "stable";
}

function riskChip(level){
  const label = level === "critical" ? "critical" : level === "warning" ? "warning" : "stable";
  return `<span class="risk-chip risk-${label}">${label}</span>`;
}

function metric(label, value){
  return `<div class="dev-metric"><div class="dev-label">${esc(label)}</div><div class="dev-value">${esc(value || "-")}</div></div>`;
}

function list(items){
  const values = (items || []).filter(x => x !== undefined && x !== null && String(x).trim());
  if(!values.length) return '<div class="dev-note">No items available.</div>';
  return `<ul class="dev-list">${values.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`;
}

function chain(items){
  const values = (items || []).filter(x => String(x || "").trim());
  if(!values.length) return '<div class="dev-note">Root-cause chain unavailable.</div>';
  return `<div class="dev-chain-row">${values.map((x, idx) => `${idx ? '<span class="dev-chain-arrow">→</span>' : ''}<span class="dev-chain-chip">${esc(x)}</span>`).join("")}</div>`;
}

function sparkline(series, level){
  const values = (series || []).map(x => Number(x) || 0);
  if(!values.length) return '<div class="sparkline"><span class="dev-note">no trend</span></div>';
  const max = Math.max(...values, 1);
  return `<div class="sparkline">${values.map(v => `<span class="sparkbar ${esc(level || "stable")}" style="height:${Math.max(10, Math.round((v / max) * 32))}px"></span>`).join("")}</div>`;
}

function timeline(items){
  const values = (items || []).slice(0, 12);
  if(!values.length) return '<div class="dev-note">Timeline unavailable.</div>';
  return `<div class="timeline">${values.map(x => `
    <div class="timeline-item">

async function loadApprovalQueue(){
  const summaryEl = document.getElementById("approval_summary");
  const cardsEl = document.getElementById("approval_cards");
  const errorEl = document.getElementById("approval_error");
  if(!summaryEl || !cardsEl) return;
  try{
    const data = await j("/api/governance/approval-queue");
    const load = data.operator_load || {};
    errorEl.innerHTML = data.ok ? "" : `<div class="dev-error">${esc(data.error || "approval queue unavailable")}</div>`;
    summaryEl.innerHTML = `
      ${metric("mode", data.mode || "recommendation_only")}
      ${metric("items", data.count ?? 0)}
      ${metric("operator load", `${load.level || "-"} (${load.score ?? 0})`)}
      ${metric("recommendation limit", load.recommendation_limit ?? "-")}
      ${metric("duplicate noise", load.duplicate_noise_suppressed ? "suppressed" : "visible")}
      ${metric("execution", "disabled")}
    `;
    const items = data.items || [];
    cardsEl.innerHTML = items.length
      ? items.map(approvalCard).join("")
      : '<div class="dev-note">No approval recommendations available. Recommendation engine remains read-only.</div>';
  }catch(e){
    errorEl.innerHTML = `<div class="dev-error">${esc(e.message || e)}</div>`;
    cardsEl.innerHTML = "";
  }
}

    <div class="dev-metric"><div class="dev-label">best_safe_remediation</div><div class="dev-value">${esc(l.best_safe_remediation || "-")}</div></div>
    <div class="dev-metric"><div class="dev-label">System Drift</div>${driftCards(c.drift)}</div>
    <div class="dev-metric"><div class="dev-label">manual actions</div>${list((l.actions || []).map(x => `${x.priority || ""} ${x.type || ""}: ${x.action || ""} (${x.reason || ""})`))}</div>
    <div class="dev-metric"><div class="dev-label">decision_trace</div>${list(l.decision_trace)}</div>
  `;

  const m = memory.data?.summary || {};
  document.getElementById("dev_panel_memory").innerHTML = `
    <div class="dev-card-grid">
      ${metric("source", m.source)}
      ${metric("incident_count", m.incident_count)}
      ${metric("patterns", (m.patterns || []).length)}
    </div>
    <div class="dev-metric"><div class="dev-label">recent incidents</div>${timeline((m.incidents || []).map(x => ({kind:"incident", at:x.detected_at, title:x.pattern_key, detail:x.diagnosis?.summary || x.severity})))}</div>
    <div class="dev-metric"><div class="dev-label">remediation attempts</div>${timeline((m.incidents || []).filter(x => x.remediation?.attempt).map(x => ({kind:"remediation", at:x.detected_at, title:x.remediation.attempt, detail:`effectiveness=${x.outcome?.effectiveness || "unknown"}`})))}</div>
    <div class="dev-metric"><div class="dev-label">recurring patterns</div>${list((m.patterns || []).map(x => `${x.pattern_name}: occurrences=${x.occurrences}, risk=${x.forecast_recurring_risk}, remediation=${x.most_effective_remediation}`))}</div>
  `;
}

async function manualRefresh(){
  await loadAll();
  showToast("refreshed");
}

function toggleAutoRefresh(enabled){
  if(__autoRefreshTimer){
    clearInterval(__autoRefreshTimer);
    __autoRefreshTimer = null;
  }
  if(enabled){
    __autoRefreshTimer = setInterval(loadAll, 3000);
  }
}

async function loadAll(){
try{
const s = await j("/api/summary");
document.getElementById("router_tasks").textContent = s.router_tasks ?? "-";
document.getElementById("execs").textContent = s.execs ?? "-";
document.getElementById("artifacts").textContent = s.artifacts ?? "-";
document.getElementById("capabilities").textContent = s.capabilities ?? "-";

const t0 = await j("/api/tasks?limit=300");
const items0 = t0.items || [];
document.getElementById("count_new").textContent = items0.filter(x => (x.status||"").toLowerCase() === "new").length;
document.getElementById("count_started").textContent = items0.filter(x => (x.status||"").toLowerCase() === "started").length;
document.getElementById("count_failed").textContent = items0.filter(x => (x.status||"").toLowerCase() === "failed").length;

const d = await j("/api/tasks?limit=300");
tasks_body.innerHTML="";
const statusFilter = (document.getElementById("filter_status")?.value || "").toLowerCase();
const botFilter = (document.getElementById("filter_bot")?.value || "").toLowerCase();
const qFilter = (document.getElementById("filter_q")?.value || "").toLowerCase();

(d.items || [])
.filter(x => !statusFilter || ((x.status||"").toLowerCase() === statusFilter))
.filter(x => !botFilter || ((x.target_bot||"").toLowerCase() === botFilter))
.filter(x => !qFilter || ((x.task_text||"").toLowerCase().includes(qFilter) || String(x.id||"").includes(qFilter)))
.slice(0, 120)
.forEach(x=>{
const card=document.createElement("div");
card.className="task_card";
card.innerHTML=`
<div class="task_card_head">
  <div class="task_card_meta">
    <span class="task_id">#${x.id ?? ""}</span>
    ${statusChip(x.status)}
    <span class="bot-badge">${x.target_bot ?? ""}</span>
    <span class="badge">${x.mode ?? ""}</span>
  </div>
</div>
<div class="task_text">${(x.task_text||"").slice(0,180)}</div>
<div class="task_actions">
  <button onclick="event.stopPropagation(); forceExec(${x.id})">▶ EXEC</button>
  <button onclick="event.stopPropagation(); taskAction(${x.id}, 'rerun')">再実行</button>
  <button onclick="event.stopPropagation(); taskAction(${x.id}, 'duplicate')">複製</button>
  <button onclick="event.stopPropagation(); taskAction(${x.id}, 'cancel')">キャンセル</button>
</div>
`;
card.onclick=()=>openDetail(x);
tasks_body.appendChild(card);
});

const r = await j("/api/relations");
relations_body.innerHTML="";

const rels = (r.items || []).slice(0,200);
const parentMap = new Map();
rels.forEach(x=>{
  const p = x.parent_id ?? "";
  if(!parentMap.has(p)) parentMap.set(p, []);
  parentMap.get(p).push(x.child_id);
});

Array.from(parentMap.entries())
  .sort((a,b)=>Number(b[0]) - Number(a[0]))
  .slice(0,50)
  .forEach(([parentId, childIds])=>{
    const trParent=document.createElement("tr");
    trParent.innerHTML=`<td class="mono"><b>${parentId}</b></td>`;
    relations_body.appendChild(trParent);

    childIds.forEach(cid=>{
      const trChild=document.createElement("tr");
      trChild.innerHTML=`<td class="mono" style="padding-left:24px;">└─ ${cid}</td>`;
      relations_body.appendChild(trChild);
    });
  });

const allItems = d.items || [];
const queueNew = document.getElementById("queue_new");
const queueStarted = document.getElementById("queue_started");
const queueFailed = document.getElementById("queue_failed");

function renderQueue(el, items){
  if(!el) return;
  el.innerHTML = "";
  items.slice(0,12).forEach(x=>{
    const div = document.createElement("div");
    div.className = "queue_item";
    div.innerHTML = `<b>#${x.id ?? ""}</b><br>${(x.task_text||"").slice(0,80)}`;
    div.onclick = () => openDetail(x);
    el.appendChild(div);
  });
}

renderQueue(queueNew, allItems.filter(x => (x.status||"").toLowerCase() === "new"));
renderQueue(queueStarted, allItems.filter(x => ["started","running","retry"].includes((x.status||"").toLowerCase())));
renderQueue(queueFailed, allItems.filter(x => ["failed","cancelled"].includes((x.status||"").toLowerCase())));
await loadDevAutopilot();
await loadApprovalQueue();
await loadTmpExec();
}catch(e){
console.error(e);
}
}

restoreFilters();
loadAll();

</script>

<div id="toast"></div>
</body>
</html>
