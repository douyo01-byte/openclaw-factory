<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>AI占い注文</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{font-family:sans-serif;background:#0f1020;color:#fff;padding:20px}
input,textarea,select{width:100%;padding:10px;margin:10px 0;border-radius:8px;border:none}
button{padding:12px 20px;background:#7c5cff;color:#fff;border:none;border-radius:999px}
</style>
</head>
<body>

<h1>AI占い注文</h1>

<form method="POST" action="https://REPLACE-ME.workers.dev/order">
<select name="plan">
<option>簡易鑑定</option>
<option>標準鑑定</option>
<option>深掘り鑑定</option>
</select>

<input name="customer_name" placeholder="名前" required>
<input name="birth_date" type="date" required>
<input name="birth_time" placeholder="出生時間">
<input name="birth_place" placeholder="出生地">
<textarea name="question" placeholder="相談内容"></textarea>
<input name="email" type="email" placeholder="メール" required>

<button type="submit">申し込む</button>
</form>

</body>
</html>
