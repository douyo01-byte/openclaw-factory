<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>恋愛AI鑑定 v3 C</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{font-family:sans-serif;background:#0f1020;color:#fff;padding:20px;line-height:1.7}
.wrap{max-width:780px;margin:0 auto}
.sec{background:#17192d;border:1px solid #2a2d4a;border-radius:18px;padding:20px;margin-bottom:18px}
.btn{display:block;width:100%;padding:16px;background:#ff4fa3;color:#fff;text-align:center;border-radius:999px;text-decoration:none;font-weight:bold;box-sizing:border-box}
.price{font-size:26px;color:#ffd36b;font-weight:bold}
.sub{color:#d7d9f3}
.point{background:#111427;border:1px solid #2a2d4a;border-radius:12px;padding:12px;margin:10px 0}
.label{display:inline-block;padding:6px 10px;border:1px solid #3b3f67;border-radius:999px;color:#d7d9f3;font-size:12px;margin-bottom:10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="sec">
    <div class="label">次の一手を決めるタイプ</div>
    <h1>恋愛で迷った時は、感情より先に“次の一手”を整理すると動きやすくなります</h1>
    <p class="sub">何をするかを決める前に、今の関係の流れと、自分に合う動き方を整理するための診断です。</p>
    <p>無料で、今の状況に対してどう動くべきかの方向性を確認できます。</p>
    <a class="btn" href="order.html?v=C">次の一手を確認する</a>
  </div>

  <div class="sec">
    <h2>こんな人に向いています</h2>
    <div class="point">今連絡していいのか判断したい</div>
    <div class="point">距離の取り方を間違えたくない</div>
    <div class="point">自分に合う動き方のヒントが欲しい</div>
  </div>

  <div class="sec">
    <h2>無料で見えること</h2>
    <div class="point">今の流れの中で気をつけたいこと</div>
    <div class="point">動くならどんな方向性が合うか</div>
    <div class="point">760円で続きを見る価値があるか</div>
  </div>

  <div class="sec">
    <p class="price">行動のヒントを詳しく見る：760円</p>
    <a class="btn" href="order.html?v=C">無料で次の一手を見る</a>
  </div>
</div>
</body>
</html>
